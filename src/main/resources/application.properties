spring.application.name=rag-poc
spring.ai.model.audio.speech=none
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=openai/gpt-oss-120b

# ---- Chat: keep Groq (OpenAI-compatible). Explicit, because the Google GenAI starter would
# otherwise also register a Gemini chat model and make the ChatModel ambiguous. ----
spring.ai.model.chat=openai

# ---- Embeddings: Gemini gemini-embedding-001 (Gemini Developer API). Key from GEMINI_API_KEY env var. ----
# 'google-genai' deselects the OpenAI embedding model.
spring.ai.model.embedding=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768
# The Google starter's image auto-configuration requires a key at startup even though images are
# not used here; reuse the same environment variable.
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# ---- PostgreSQL (credentials come from environment variables; no secrets in this file) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ---- pgvector store (gemini-embedding-001 configured for 768-dimensional vectors) ----
# Separate table per embedding model. Old tables (excel_vector_store = MiniLM 384 dims,
# excel_vector_store_openai = OpenAI 1536 dims) are left untouched and are no longer read.
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=excel_vector_store_gemini
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# ---- RAG tuning ----
app.rag.top-k=15
app.rag.similarity-threshold=0.2

# ---- Upload limits (Spring's default is only 1MB, too small for typical PDFs) ----
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
